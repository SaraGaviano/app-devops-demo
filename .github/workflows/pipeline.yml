name: Pipeline demo ServiceNow DevOps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: ServiceNow Register Artifact
        uses: ServiceNow/servicenow-devops-register-artifact@v7.1.0
        with:
          devops-integration-user-name: ${{ secrets.SN_USER }}
          devops-integration-user-password: ${{ secrets.SN_PASSWORD }}
          instance-url: ${{ vars.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          artifacts: '[{"name": "com:app-devops-demo","version": "1.${{ github.run_number }}","semanticVersion": "1.${{ github.run_number }}.0","repositoryName": "${{ github.repository }}"}]'

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test

  deploy-prod:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: ServiceNow Change
        id: create
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-user-name: ${{ secrets.SN_USER }}
          devops-integration-user-password: ${{ secrets.SN_PASSWORD }}
          instance-url: ${{ vars.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy'
          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"short_description":"DEMO - Rilascio applicazione web di esempio build 1.${{ github.run_number }}","description":"Progetto di esempio per demo cliente. Rilascio generato dalla pipeline GitHub, commit ${{ github.sha }}, run ${{ github.run_number }}. Deploy simulato: nessun sistema di produzione viene modificato. Test automatici superati nella stessa run.","implementation_plan":"1. Build e registrazione dell artefatto 1.${{ github.run_number }} in DevOps. 2. Test automatici. 3. Approvazione CAB. 4. Deploy simulato in ambiente di prova.","backout_plan":"Ripristino della versione precedente dell artefatto registrata nella run precedente, oppure git revert del commit ${{ github.sha }} e nuova esecuzione della pipeline. Tempo stimato di ripristino: 15 minuti.","test_plan":"npm test superato nella run ${{ github.run_number }}, con evidenza collegata alla pipeline in DevOps.","assignment_group":"b85d44954a3623120004689b2d5dd60a"}}'
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true
      - name: Deploy simulato
        run: echo "Deploy in produzione simulato"
